name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (Linux build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check generated diagrams
        run: pnpm run diagrams:check

      - name: Typecheck packages
        run: pnpm run typecheck:packages

      - name: Build packages
        run: pnpm run build:packages

  site:
    name: Site (SolidStart static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build:site

  desktop:
    name: Desktop (${{ matrix.kind }}, x64 + arm64)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: windows
          - os: ubuntu-latest
            kind: linux
          - os: macos-latest
            kind: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package Windows (MSI + zip, x64 + arm64)
        if: matrix.kind == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run build:win

      - name: Install Flatpak build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils squashfs-tools
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Package Linux (deb + AppImage + flatpak, x64 + arm64)
        if: matrix.kind == 'linux'
        run: pnpm run build:linux

      - name: Package macOS (DMG, x64 + arm64)
        if: matrix.kind == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run build:mac

      - name: Pack workspace libraries
        if: matrix.kind == 'windows'
        run: pnpm run pack:packages

      - name: Upload bridge-windows
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-windows
          path: |
            apps/desktop/release/**/*.msi
            apps/desktop/release/**/*.msix
            apps/desktop/release/**/*.zip
            dist-pack/*.tgz

      - name: Upload bridge-linux
        if: matrix.kind == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-linux
          path: |
            apps/desktop/release/**/*.deb
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.flatpak

      - name: Upload bridge-macos
        if: matrix.kind == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-macos
          path: apps/desktop/release/**/*.dmg
