name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  packages:
    name: Packages (Linux build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm run typecheck:packages

      - name: Build packages
        run: pnpm run build:packages

  desktop:
    name: Desktop zip + library packs
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package Windows zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run build:win

      - name: Pack workspace libraries
        run: pnpm run pack:packages

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: bridge-packages-tgz
          path: dist-pack/*.tgz

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-desktop-win-zip
          path: apps/desktop/release/*.zip

  publish:
    name: Publish GitHub Release
    needs: [packages, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download package tarballs
        uses: actions/download-artifact@v4
        with:
          name: bridge-packages-tgz
          path: release-assets

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: bridge-desktop-win-zip
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tgz
            release-assets/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
